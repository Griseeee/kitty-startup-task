services:
  backend:
    build: ./backend
    restart: always
    expose:
      - "3001"

  frontend:
    build: ./frontend
    restart: always
    expose:
      - "3000"
    depends_on:
      - backend

  nginx:
    build: ./nginx
    restart: always
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend